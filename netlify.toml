# Configuración de Netlify para el sitio del LANDING (raíz del repo).
#
# OJO: este archivo está en la RAÍZ, así que Netlify lo aplica a los sitios que
# construyen desde este repo SIN un "Base directory" propio. El sitio de la Mini
# App sí tiene Base directory = tma, y por eso lee su propio tma/netlify.toml
# (las rutas de ESTE archivo se resolverían relativas a esa base y romperían el
# build: publish="tma" + base="tma" => "tma/tma", que no existe).
#
# Historial del bug (para no repetirlo): este archivo se creó en jun-2026 con
# publish="landing" para arreglar el landing, y de paso dejó sin desplegar al
# sitio de la Mini App durante semanas.
[build]
  publish = "landing"
